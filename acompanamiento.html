<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareMatch | Acompañamiento</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <img class="logo-img" src="img/Logo.png" alt="Logo CareMatch">
      <span><b>Care</b>Match</span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
      <a class="btn-login" href="login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main class="page">
    <a class="back-arrow" href="servicios.html">←</a>
    <h1>Acompañamiento</h1>
    <p class="subtitle">Personas disponibles para acompañar en trámites, paseos, controles médicos o actividades recreativas.</p>

    <section class="filters">
      <input id="searchInput" type="text" placeholder="Buscar por nombre o comuna" />
      <select id="filterSelect">
        <option value="todos">Todos los servicios</option>
        <option value="trámites">Trámites</option>
        <option value="paseos">Paseos</option>
        <option value="controles">Controles médicos</option>
      </select>
    </section>

    <section class="people-grid" id="cardsContainer"></section>
  </main>

  <footer>CareMatch © 2026</footer>
  <script src="app.js"></script>
  <script>renderCards('acompanamiento');</script>
</body>
</html>
