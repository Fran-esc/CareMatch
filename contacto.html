<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareMatch | Contacto</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html"><img class="logo-img" src="img/Logo.png" alt="Logo CareMatch"><span><b>Care</b>Match</span></a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
      <a class="btn-login" href="login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main class="contact-page">
    <section class="contact-form-box">
      <h1>¿Necesitas ayuda? Contáctanos</h1>
      <form id="contactForm">
        <input type="text" id="nombreContacto" placeholder="Nombre y apellido" required />
        <input type="tel" id="telefonoContacto" placeholder="Teléfono" required />
        <input type="email" id="correoContacto" placeholder="Correo electrónico" required />
        <textarea id="mensajeContacto" placeholder="Mensaje" rows="6" required></textarea>
        <button class="btn-primary" type="submit">Enviar mensaje</button>
      </form>
      <p id="contactMsg" class="success-msg"></p>
    </section>
    <section class="contact-side">
      <h2>Atención personalizada</h2>
      <p>Responderemos tu solicitud para ayudarte a encontrar el servicio más adecuado.</p>
      <div class="assistant-card">👩‍💼</div>
    </section>
  </main>

  <footer>CareMatch © 2026</footer>
  <script src="app.js"></script>
</body>
</html>
