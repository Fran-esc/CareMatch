<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareMatch | Pago WebPay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <img class="logo-img" src="img/Logo.png" alt="Logo CareMatch">
      <span><b>Care</b>Match</span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
      <a href="profile.html">Mi Perfil</a>
      <a href="messages.html">Mensajes</a>
      <a class="btn-login" href="login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main>
    <section class="page">
      <a href="booking.html" class="back-arrow">←</a>
      <h1 class="title-line">Pago WebPay</h1>
      <p class="subtitle">Completa el pago simulado para confirmar tu servicio.</p>

      <div class="payment-panel">
        <div id="paymentSummary" class="payment-summary"></div>
        <div id="webpayLoading" style="text-align: center; padding: 30px;">
          <h2 style="color: #006178;">Generando pago seguro...</h2>
          <p>Por favor espera, serás redirigido a Transbank Webpay Plus.</p>
        </div>
        
        <form id="transbankForm" method="POST" action="" class="hidden">
          <input type="hidden" name="token_ws" id="token_ws" value="" />
        </form>

        <div style="text-align: center;">
          <p id="paymentMessage" class="message"></p>
          <button type="button" id="returnServicesBtn" class="btn-secondary hidden" style="margin-top: 15px;">Volver a servicios</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 CareMatch. Todos los derechos reservados.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initWebpayPage);
  </script>
</body>
</html>
