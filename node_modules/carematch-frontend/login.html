<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareMatch | Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <img class="logo-img" src="img/Logo.png" alt="Logo CareMatch">
      <span><b>Care</b>Match</span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
      <a class="btn-login" href="login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-box">
      <h1>Bienvenido a CareMatch</h1>
      <p id="authMsg" class="success-msg"></p>

      <div class="auth-options">
        <button id="showLogin">Iniciar sesión</button>
        <button id="showRegister">Registrarse</button>
      </div>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
        <input type="password" id="loginPassword" placeholder="Contraseña" required>
        <button type="submit" class="btn-primary">Iniciar sesión</button>
      </form>

      <form id="registerForm" class="hidden">
        <input type="text" id="regName" placeholder="Nombre completo" required>
        <input type="email" id="regEmail" placeholder="Correo electrónico" required>
        <input type="password" id="regPassword" placeholder="Contraseña" required>
        <select id="regRole" required>
          <option value="">Selecciona tu rol</option>
          <option value="solicitante">Solicitante de servicio</option>
          <option value="cuidador">Cuidador/a</option>
          <option value="profesional">Profesional de salud</option>
          <option value="acompañante">Acompañante</option>
        </select>
        <button type="submit" class="btn-primary">Registrarse</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 CareMatch. Todos los derechos reservados.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
