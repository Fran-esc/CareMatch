<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareMatch | Contacto</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <img class="logo-img" src="img/Logo.png" alt="Logo CareMatch">
      <span><b>Care</b>Match</span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
      <a class="btn-login" href="login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main class="contact-page">
    <div class="contact-form-box">
      <h1>Contáctanos</h1>
      <p id="contactMsg" class="success-msg"></p>
      <form id="contactForm">
        <input type="text" id="nombreContacto" placeholder="Tu nombre" required>
        <input type="tel" id="telefonoContacto" placeholder="Tu teléfono" required>
        <input type="email" id="correoContacto" placeholder="Tu correo" required>
        <textarea id="mensajeContacto" placeholder="Tu mensaje" rows="5" required></textarea>
        <button type="submit" class="btn-primary">Enviar mensaje</button>
      </form>
    </div>
    <div class="contact-side">
      <h2>¿Tienes dudas?</h2>
      <p>Nuestro equipo está disponible para ayudarte.</p>
      <div class="assistant-card">
        👨‍💼
      </div>
      <p><strong>Teléfono:</strong> +56 9 XXXX XXXX</p>
      <p><strong>Email:</strong> info@carematch.cl</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 CareMatch. Todos los derechos reservados.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
